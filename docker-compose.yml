services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rca_user
      POSTGRES_PASSWORD: rca_pass
      POSTGRES_DB: regulatory_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca_user -d regulatory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # API + worker are opt-in: `docker compose --profile app up -d --build`
  # (plain `docker compose up -d` only starts Postgres and Redis for local dev)
  api:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment: &container_env
      # .env points at localhost for local dev; inside the network use service names
      DATABASE_URL: postgresql+asyncpg://rca_user:rca_pass@db:5432/regulatory_db
      DATABASE_URL_SYNC: postgresql://rca_user:rca_pass@db:5432/regulatory_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Ollama (embeddings, local LLMs) runs on the host
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  worker:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    # --beat embeds the scheduler so the daily scrape in beat_schedule actually fires
    command: celery -A src.worker.celery_app worker --beat --loglevel=info
    env_file: .env
    environment: *container_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pg_data:
