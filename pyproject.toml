[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regulatory-change-analyzer"
version = "0.1.0"
description = "Automated monitoring and impact analysis of regulatory changes (CNBV, SEC, etc.)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",  # [asyncio] pulls greenlet, no longer a default dep
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    # Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # Document parsing
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    # Scraping / HTTP
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "feedparser>=6.0.0",
    # LLM (Claude)
    "anthropic>=0.97.0",
    # Task queue
    "celery>=5.4.0",
    "redis>=5.0.0",
    # Utilities
    "tenacity>=8.0.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
# Semantic features: clause/change embeddings, pgvector similarity search, RAG vector
# retrieval. Without it the app still runs — impact mapping uses the rules engine and
# chat retrieval falls back to keyword search. (~2 GB with CUDA torch; for CPU-only:
#   pip install --index-url https://download.pytorch.org/whl/cpu torch  before this.)
ml = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "hypothesis>=6.0.0",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL+pgvector database (see tests/integration)"]
# Unit tests by default; CI runs `-m integration` separately against a DB service
addopts = "-m 'not integration'"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit, so a new ruff release cannot change what CI enforces (ruff 0.17 widened its defaults
# and failed CI on 147 pre-existing findings). These are the rules the codebase is clean against.
select = ["E4", "E7", "E9", "F"]
