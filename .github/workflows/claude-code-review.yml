name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, bots (Dependabot has no access to secrets anyway) and untrusted authors
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the Regulatory Change Analyzer (FastAPI + async
            SQLAlchemy/pgvector backend, React/Vite frontend). Read CLAUDE.md first — it
            lists the conventions this codebase relies on.

            Report only real problems, most severe first. Check in particular:
            1. Correctness: async misuse (blocking/CPU work on the event loop, lazy-loading
               relationships in an async session), transaction handling, SSE event shapes
               that must match frontend/src/pages/*.tsx, FastAPI route ordering.
            2. Security: every new route declares a Require* role dependency; no
               client-controlled file paths; text rendered in ReportLab Paragraphs is
               XML-escaped; secrets or personal data never committed or logged.
            3. Regulatory logic: changes to rules_engine / classifier / trend_extractor keywords
               that could cause false positives or silently drop matches.
            4. Tests: new behaviour has a unit test, and an integration test in
               tests/integration when it touches the DB or HTTP layer.

            Use inline comments for specific lines. Finish with one short top-level summary
            comment. If you find nothing worth changing, say so in one line — no praise lists.
          claude_args: |
            --model claude-opus-5-5
            --permission-mode default
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
